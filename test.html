<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Websocket Live Test Rig</title>
        <style>
            body{
                font-family: sans-serif;
                padding: 20px;
                background:#121212;
                color:#fff;
            }
            #log{
                background:#000;
                padding: 20px;
                height: 400px;
                overflow-y: scroll;
                border: 1px solid #fff;
            }
            .status-on{
                color:green;
            }
            .status-off{
                color:red;
            }
        </style>
    </head>

    <body>
        <h1>Websocket Live Console</h1>
        <p id="status" class="status-off">Connecting...</p>
        <form id="message-form">
            <input type="text" id="message-input" placeholder="Type a message..." required/>
            <button type="submit">Deploy Message</button>
        </form>

        <h3>Live Logs : </h3>
        <pre id="log"></pre>
    </body>
    <script>
        const statusEl = document.getElementById('status');
        const log = document.getElementById('log');
        const input = document.getElementById('message-input');

        const socket = new WebSocket('ws://localhost:8080');

        const appendLog = (label,message)=>{
            entry = `${new Date().toLocaleTimeString()}  ${label}  ${message}\n`;
            log.textContent = entry + log.textContent;
        } 

        socket.addEventListener('open',()=>{
                statusEl.textContent = `CONNECTED at : ws://localhost:8080`;
                statusEl.className = 'status-on';
                appendLog('[SYSTEM]','Tunnel Established.');
        })

        socket.addEventListener('message',(e)=>{
            appendLog('[RECIEVED]' , `${event.data}.`);
        })

        socket.addEventListener('close',()=>{
            statusEl.textContent = `DISCONNECTED`;
            statusEl.className = 'status-off';
            appendLog('[SYSTEM]','Tunnel Collapsed.');
        })


        document.getElementById('message-form').addEventListener('submit',(e)=>{
            e.preventDefault();
            
            if(socket.readyState !== WebSocket.OPEN)
            {
                appendLog('[Error]','No Active Tunnel.');
            }    
            const message = input.value.trim();
            socket.send(message);
            appendLog('[SENT]',message);
            input.value = ''
        })
    </script>
</html>
